<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IWATE NEWS WATCH 岩手の新着を集める機械たち</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
<style>
:root{
  --bg:#DEDBD5; --surface:#ECE9E4; --ink:#2A2826; --muted:#6B655E;
  --line:#C4BFB7; --bronze:#8E6436; --ok:#3E7A69; --trial:#8E6436;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1F1E1C; --surface:#2E2C2A; --ink:#DDD6CA; --muted:#9C948A;
    --line:#46423E; --bronze:#C49A68; --ok:#7DB5A5; --trial:#C49A68;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;line-height:1.7}
main{max-width:960px;margin:0 auto;padding:40px 20px 56px}
.org{font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:900;
  letter-spacing:.12em;font-size:.95rem;color:var(--bronze);margin:0 0 6px}
h1{font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.35;margin:0 0 10px}
.lead{color:var(--muted);margin:0 0 32px;max-width:40em}
.bays{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.bay{display:flex;gap:18px;padding:18px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;color:inherit;text-decoration:none;transition:border-color .2s}
a.bay:hover,a.bay:focus-visible{border-color:var(--bronze)}
a.bay:focus-visible{outline:2px solid var(--bronze);outline-offset:3px}
.bay img{width:104px;height:auto;flex:none;border-radius:8px;align-self:flex-start}
.info{min-width:0;display:flex;flex-direction:column}
.name{font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:900;
  font-size:1.6rem;letter-spacing:.08em;line-height:1.1;margin:2px 0 2px}
.model{font-size:.8rem;color:var(--bronze);margin:0 0 10px}
.scope{margin:0 0 12px;font-size:.95rem}
.state{margin-top:auto;font-size:.8rem;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.state::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.state.trial::before{background:var(--trial)}
.open{font-size:.9rem;color:var(--bronze);margin-top:6px}
.empty{border-style:dashed;background:transparent;align-items:center;justify-content:center;
  min-height:180px;color:var(--muted);text-align:center;font-size:.9rem}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<main>
  <p class="org">IWATE NEWS WATCH</p>
  <h1>岩手の新着を集める機械たち</h1>
  <p class="lead">県内の役所や機関が出すお知らせを、分野ごとの機体が見張っています。見たい機体を選んでください。</p>

  <div class="bays" id="bays"></div>

  <footer>掲載している情報は、各機関の公式サイトから自動で集めたものです。内容は必ずリンク先の公式サイトでご確認ください。</footer>
</main>

<script>
/*
  ===== 機体の一覧 =====
  兄弟サイトを増やすときは、この一覧に { ... } を1つ書き足すだけです。
  name   : 機体名
  model  : 型番
  scope  : 何を集めているか
  url    : サイトのURL（このページからの相対パス）
  logo   : ロゴ画像のURL
  status : "稼働中" または "試験運用中"
*/
const SITES = [
  {
    name: "NAMBU",
    model: "行政情報自動収集機 IW-33",
    scope: "岩手県内33市町村の新着情報",
    url: "/test/",
    logo: "/test/nambu-logo.svg",
    status: "稼働中"
  },
  {
    name: "GINGA",
    model: "官公庁・機関情報収集装置 GN-16",
    scope: "県内の国の出先機関と、大学・研究機関（16機関）の新着情報",
    url: "/agencies/",
    logo: "/agencies/ginga-logo.svg",
    status: "稼働中"
  }
];

const bays = document.getElementById("bays");
for (const s of SITES) {
  const a = document.createElement("a");
  a.className = "bay";
  a.href = s.url;
  const img = document.createElement("img");
  img.src = s.logo; img.alt = s.name + "のロゴ"; img.width = 104; img.height = 165;
  img.onerror = () => img.remove();
  const info = document.createElement("div");
  info.className = "info";
  info.innerHTML =
    '<p class="name"></p><p class="model"></p><p class="scope"></p>' +
    '<span class="state"></span><span class="open">ページを開く</span>';
  info.querySelector(".name").textContent = s.name;
  info.querySelector(".model").textContent = s.model;
  info.querySelector(".scope").textContent = s.scope;
  const st = info.querySelector(".state");
  st.textContent = s.status;
  if (s.status !== "稼働中") st.classList.add("trial");
  a.append(img, info);
  bays.append(a);
}
const empty = document.createElement("div");
empty.className = "bay empty";
empty.textContent = "空きベイ　次の機体を準備中";
bays.append(empty);
</script>
</body>
</html>
